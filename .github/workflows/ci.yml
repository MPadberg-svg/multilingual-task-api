name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: Lint, Format & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: flake8 apps/ config/ tests/ --max-line-length=100 --exclude=migrations
      - run: black --check --line-length=100 apps/ config/ tests/
      - run: isort --check-only apps/ config/ tests/
      - run: mypy apps/ config/

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: lint
    env:
      DJANGO_SETTINGS_MODULE: config.settings.testing
      SECRET_KEY: ci-test-secret-key-not-for-production-0123456789abcdef
      OPENAI_API_KEY: sk-test-dummy-key
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Check migrations drift
        run: python manage.py makemigrations --check --dry-run
      - name: Run test suite with coverage gate
        run: pytest --cov=apps --cov-report=xml --cov-fail-under=90
      - name: Upload coverage report
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: bandit -r apps/ config/ -ll --exclude apps/core/migrations,apps/tasks/migrations -f json -o bandit-report.json || (bandit -r apps/ config/ -ll --exclude apps/core/migrations,apps/tasks/migrations && exit 1)
      - run: pip-audit -r requirements.txt --strict
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: bandit-report
          path: bandit-report.json

  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
      - name: Check Terraform HCL formatting
        run: terraform fmt -check -recursive terraform/
      - name: Initialize & validate Terraform IaC
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate

  docker:
    name: Container Build & Smoke Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - name: Build hardened multi-stage production image
        run: docker build -t multilingual-task-api:ci-smoke .
      - name: Verify non-root UID, read-only /app, and .dockerignore invariants
        run: |
          test "$(docker run --rm multilingual-task-api:ci-smoke id -u)" = "1000"
          docker run --rm multilingual-task-api:ci-smoke sh -c '
            test ! -w /app/manage.py &&
            test -f /app/docs/api-explorer.html &&
            test -d /app/staticfiles/admin &&
            test ! -d /app/.git &&
            test ! -d /app/terraform
          '
      - name: Boot container and smoke-test /api/v1/live/ and /explorer/ CSP nonce
        run: |
          docker run -d --name mltask-smoke -p 18000:8000 \
            -e DJANGO_SETTINGS_MODULE=config.settings.testing \
            multilingual-task-api:ci-smoke
          trap 'docker logs mltask-smoke || true; docker rm -f mltask-smoke || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18000/api/v1/live/ | grep -q '"alive"'; then
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "::error::Container liveness probe did not become healthy"
              exit 1
            fi
            sleep 1
          done
          HEADERS=$(curl -fsSI http://127.0.0.1:18000/explorer/)
          echo "$HEADERS" | grep -qi "content-security-policy:.*'nonce-"

  integration:
    name: PostgreSQL 16 & Redis 7 Integration
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: multilingual_task_api
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d multilingual_task_api"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.ci_integration
      SECRET_KEY: ci-integration-secret-key-not-for-prod-0123456789abcdef
      POSTGRES_DB: multilingual_task_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      OPENAI_API_KEY: sk-test-dummy-key
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify migrations apply cleanly on PostgreSQL 16
        run: python manage.py migrate --noinput
      - name: Run full suite & live SKIP LOCKED / Redis 7 integration matrix
        run: |
          if ! pytest --ds=config.settings.ci_integration --reuse-db apps/ tests/integration/ > /tmp/pytest.log 2>&1; then
            cat /tmp/pytest.log
            SUMMARY=$(grep -E "^(FAILED|ERROR|E   )" /tmp/pytest.log | tail -n 15 | tr '\n' ' ' | cut -c1-800)
            echo "::error::PG16/Redis7 pytest failure: ${SUMMARY:-$(tail -n 10 /tmp/pytest.log | tr '\n' ' ')}"
            exit 1
          fi
          cat /tmp/pytest.log



