name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: Lint, Format & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: flake8 apps/ config/ tests/ --max-line-length=100 --exclude=migrations
      - run: black --check --line-length=100 apps/ config/ tests/
      - run: isort --check-only apps/ config/ tests/
      - run: mypy apps/ config/

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: lint
    env:
      DJANGO_SETTINGS_MODULE: config.settings.testing
      SECRET_KEY: ci-test-secret-key-not-for-production-0123456789abcdef
      OPENAI_API_KEY: sk-test-dummy-key
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Check migrations drift
        run: python manage.py makemigrations --check --dry-run
      - name: Run test suite with coverage gate
        run: pytest --cov=apps --cov-report=xml --cov-fail-under=90
      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: bandit -r apps/ config/ -ll --exclude apps/core/migrations,apps/tasks/migrations -f json -o bandit-report.json || (bandit -r apps/ config/ -ll --exclude apps/core/migrations,apps/tasks/migrations && exit 1)
      - run: pip-audit -r requirements.txt --strict
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
